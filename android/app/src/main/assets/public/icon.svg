<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="110" fill="#070707"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#D4AF37" stroke-width="6" stroke-opacity="0.35"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#855806"/>
    </linearGradient>
  </defs>
  <!-- Crown / Royal Crest -->
  <path d="M176 170 L256 120 L336 170 L304 220 L208 220 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Diamond Jewel Motif -->
  <polygon points="256,90 270,110 256,125 242,110" fill="#FFF2A1"/>
  <!-- Lettermark BGK -->
  <text x="256" y="320" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="82" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">BGK</text>
  <!-- Subtitle WEAR -->
  <text x="256" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="14" opacity="0.85">WEAR</text>
  <!-- Accent Line -->
  <line x1="160" y1="410" x2="352" y2="410" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
